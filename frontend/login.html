<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Campus Help Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">🎓 Campus Help Platform</div>
    <div><a href="index.html">Home</a><a href="register.html">Register</a></div>
</nav>

<div class="container">
    <div class="card">
        <h2>Login</h2>
        <div id="msgBox"></div>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const body = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        const data = await apiCall('/auth/login', 'POST', body, false);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
    } catch (err) {
        showMessage('msgBox', err.message, 'error');
    }
});
</script>

</body>
</html>
