<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Campus Help Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --dark:#0b1b33; --primary:#1e5eff; --border:#e2e8f0; --muted:#6b7789; }
  body { font-family:'Inter',sans-serif; background:#f4f6fa; color:var(--dark); padding-top:76px; }

  .topbar {
    position:fixed; top:0; left:0; width:100%; height:76px; background:var(--dark); color:white;
    display:flex; align-items:center; justify-content:space-between; padding:0 2rem; z-index:1000;
  }
  .topbar .brand { display:flex; align-items:center; gap:0.6rem; font-weight:700; font-size:1.2rem; }
  .topbar .brand i { color:#ffb020; }
  .logout-btn {
    background:transparent; border:1.5px solid rgba(255,255,255,0.3); color:white; padding:0.5rem 1.2rem;
    border-radius:30px; cursor:pointer; font-weight:600; font-family:'Inter',sans-serif;
  }
  .logout-btn:hover { background:rgba(255,255,255,0.1); }

  .container { max-width:1100px; margin:0 auto; padding:2rem 1.5rem; }

  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem; }
  .stat-card {
    background:white; border-radius:16px; padding:1.3rem; box-shadow:0 6px 16px rgba(0,0,0,0.05);
    border:2px solid transparent; cursor:pointer; text-align:left; font-family:'Inter',sans-serif;
    transition:0.2s; width:100%;
  }
  .stat-card:hover { box-shadow:0 10px 24px rgba(0,0,0,0.1); transform:translateY(-2px); }
  .stat-card.active { border-color:var(--primary); }
  .stat-card .num { font-size:1.8rem; font-weight:700; color:var(--primary); }
  .stat-card .label { font-size:0.8rem; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:6px; }

  .panel { background:white; border-radius:16px; padding:1.5rem; box-shadow:0 6px 16px rgba(0,0,0,0.05); }
  .panel-title { font-size:1.1rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
  table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  th, td { text-align:left; padding:0.7rem 0.6rem; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-size:0.75rem; text-transform:uppercase; }
  tr.clickable-row { cursor:pointer; transition:0.15s; }
  tr.clickable-row:hover { background:#f7f9fc; }
  .badge { padding:2px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; }
  .badge.active { background:#dcfce7; color:#16a34a; }
  .badge.blocked { background:#fdeaea; color:#d32f2f; }
  .small-btn {
    padding:0.35rem 0.9rem; border-radius:20px; border:none; font-size:0.75rem; font-weight:700;
    cursor:pointer; margin-right:4px; font-family:'Inter',sans-serif;
  }
  .btn-block { background:#fdeaea; color:#d32f2f; }
  .btn-unblock { background:#dcfce7; color:#16a34a; }
  .btn-del { background:#fdeaea; color:#d32f2f; }
  .loading-text { color:var(--muted); font-size:0.9rem; padding:1rem 0; }

  .user-name-link { color:var(--primary); font-weight:600; cursor:pointer; background:none; border:none; padding:0; font-family:'Inter',sans-serif; font-size:inherit; text-align:left; }
  .user-name-link:hover { text-decoration:underline; }

  /* ===== MODALS (user details + post details) ===== */
  .modal-overlay {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.55); z-index:2000; justify-content:center; align-items:center; padding:1.5rem;
  }
  .modal-overlay.active { display:flex; }
  .modal-box {
    background:white; border-radius:20px; padding:2rem; max-width:480px; width:100%;
    max-height:90vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .modal-box.modal-wide { max-width:600px; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
  .modal-header h2 { font-size:1.3rem; font-weight:700; }
  .modal-close { font-size:1.8rem; cursor:pointer; color:var(--muted); line-height:1; }
  .modal-close:hover { color:var(--dark); }
  .detail-row { display:flex; justify-content:space-between; padding:0.6rem 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .detail-row span:first-child { color:var(--muted); font-weight:600; }
  .detail-row span:last-child { font-weight:600; text-align:right; }
  .modal-actions { display:flex; gap:0.6rem; margin-top:1.5rem; flex-wrap:wrap; }
  .btn-modal, .btn-save, .btn-cancel, .btn-danger {
    padding:0.7rem 1.3rem; border-radius:30px; border:none; font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:'Inter',sans-serif; flex:1; display:inline-flex; align-items:center;
    justify-content:center; gap:6px; transition:0.2s;
  }
  .btn-save { background:var(--primary); color:white; }
  .btn-save:hover { background:#1749d0; }
  .btn-cancel { background:#f0f0f0; color:var(--dark); }
  .btn-cancel:hover { background:#e0e0e0; }
  .btn-danger { background:#fdeaea; color:#d32f2f; }
  .btn-danger:hover { background:#d32f2f; color:white; }

  /* post detail view */
  .post-detail-view p { margin:6px 0; font-size:0.9rem; }
  .post-detail-view img {
    display:block; width:100%; max-width:260px; aspect-ratio:1/1;
    object-fit:cover; border-radius:12px; margin:8px auto;
  }

  /* form for editing a post */
  .form-group { margin-bottom:0.9rem; }
  .form-group label { display:block; font-weight:600; font-size:0.8rem; margin-bottom:0.3rem; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:0.65rem 0.9rem; border:1.5px solid var(--border); border-radius:10px;
    font-size:0.88rem; background:#fafcff; font-family:'Inter',sans-serif;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--primary); background:white;
  }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }

  /* comments inside post modal */
  .comments-section { margin-top:1.2rem; padding-top:1.2rem; border-top:1px solid var(--border); }
  .comments-section h3 { font-size:0.95rem; font-weight:700; margin-bottom:0.7rem; }
  .comment-item { display:flex; gap:0.6rem; padding:0.6rem 0; border-bottom:1px solid var(--border); }
  .comment-item:last-child { border-bottom:none; }
  .comment-avatar {
    width:30px; height:30px; border-radius:50%; background:#e9efff; color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.75rem;
    flex-shrink:0; overflow:hidden;
  }
  .comment-avatar img { width:100%; height:100%; object-fit:cover; }
  .comment-avatar.admin-avatar { background:var(--dark); color:#ffb020; }
  .comment-body { flex:1; }
  .comment-author { font-weight:600; font-size:0.82rem; }
  .comment-author.is-admin { color:var(--dark); }
  .comment-time { font-size:0.68rem; color:#9aa7b8; margin-left:6px; }
  .comment-text { font-size:0.82rem; color:#4a5b6e; margin-top:2px; }
  .no-comments { color:#9aa7b8; font-size:0.82rem; text-align:center; padding:0.8rem 0; }

  /* Replies: indented + left accent bar so it's clear which top-level
     comment a reply belongs to */
  .comment-item.is-reply {
    margin-left: 2.4rem;
    padding-left: 0.7rem;
    border-left: 2.5px solid #e9efff;
    background: #fafcff;
    border-radius: 0 10px 10px 0;
    margin-top: 2px;
  }
  .comment-item.is-reply .comment-avatar { width: 24px; height: 24px; font-size: 0.65rem; }
  .reply-to-tag {
    font-size: 0.68rem; color: var(--primary); font-weight: 600;
    margin-bottom: 2px; display: flex; align-items: center; gap: 4px;
  }
  .comment-actions-row { display: flex; gap: 0.8rem; align-items: center; margin-top: 3px; }
  .comment-reply-btn {
    background: none; border: none; color: var(--primary); cursor: pointer;
    font-size: 0.74rem; font-weight: 700; padding: 0; font-family: 'Inter', sans-serif;
  }
  .comment-reply-btn:hover { text-decoration: underline; }
  .replying-banner {
    display: none; align-items: center; justify-content: space-between;
    background: #e9efff; color: var(--primary); font-size: 0.78rem; font-weight: 600;
    padding: 0.45rem 0.7rem; border-radius: 10px; margin-top: 0.6rem;
  }
  .replying-banner.active { display: flex; }
  .replying-banner button {
    background: none; border: none; color: var(--primary); cursor: pointer;
    font-size: 0.95rem; padding: 0; margin: 0;
  }

  .admin-comment-box { display:flex; gap:0.5rem; margin-top:0.8rem; }
  .admin-comment-box input {
    flex:1; padding:0.65rem 0.9rem; border:1.5px solid var(--border); border-radius:20px;
    font-size:0.85rem; font-family:'Inter',sans-serif;
  }
  .admin-comment-box input:focus { outline:none; border-color:var(--primary); }
  .admin-comment-box button {
    background:var(--dark); color:white; border:none; padding:0 1.2rem; border-radius:20px;
    font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .comments-list-row { cursor:pointer; }

  @media (max-width:600px) {
    .form-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i class="fas fa-user-shield"></i> Campus Help — Admin Dashboard</div>
  <button class="logout-btn" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>

<div class="container">

  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="num">–</div><div class="label">Loading stats...</div></div>
  </div>

  <div class="panel">
    <div class="panel-title" id="panelTitle"><i class="fas fa-users"></i> All Users</div>
    <div id="panelContent">
      <div class="loading-text">Loading...</div>
    </div>
  </div>

</div>

<!-- User Details Modal -->
<div id="userDetailsModal" class="modal-overlay" onclick="closeUserModalOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2><i class="fas fa-user"></i> User Details</h2>
      <span class="modal-close" onclick="closeUserModal()">&times;</span>
    </div>
    <div id="userDetailsBody"></div>
  </div>
</div>

<!-- Post Details Modal (blood request / lost&found item) -->
<div id="postDetailsModal" class="modal-overlay" onclick="closePostModalOnOverlay(event)">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <h2 id="postDetailsTitle"><i class="fas fa-file-alt"></i> Post Details</h2>
      <span class="modal-close" onclick="closePostModal()">&times;</span>
    </div>
    <div id="postDetailsBody"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
