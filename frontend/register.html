<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Campus Help Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">🎓 Campus Help Platform</div>
    <div><a href="index.html">Home</a><a href="login.html">Login</a></div>
</nav>

<div class="container">
    <div class="card">
        <h2>Create an Account</h2>
        <div id="msgBox"></div>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <label>Student/Staff ID</label>
            <input type="text" id="student_id">

            <label>Phone</label>
            <input type="text" id="phone">

            <label>Blood Group</label>
            <select id="blood_group">
                <option value="">-- Select --</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>O+</option><option>O-</option>
                <option>AB+</option><option>AB-</option>
            </select>

            <label>Department</label>
            <input type="text" id="department">

            <button type="submit">Register</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const body = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            student_id: document.getElementById('student_id').value,
            phone: document.getElementById('phone').value,
            blood_group: document.getElementById('blood_group').value,
            department: document.getElementById('department').value
        };
        await apiCall('/auth/register', 'POST', body, false);
        showMessage('msgBox', 'Registration successful! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
        showMessage('msgBox', err.message, 'error');
    }
});
</script>

</body>
</html>
