<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Campus Help · Register (final)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f9fc;
      --card-bg: #ffffff;
      --primary: #1e5eff;
      --primary-soft: #e9efff;
      --text-dark: #0b1b33;
      --text-muted: #4a5b6e;
      --border: #e2e8f0;
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 16px 32px rgba(0, 0, 0, 0.07);
      --radius: 22px;
      --topbar-height: 76px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding-top: var(--topbar-height);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      height: var(--topbar-height);
    }

    .topbar.header-hidden {
      transform: translateY(-100%);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      background: var(--primary);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 6px 14px rgba(30, 95, 255, 0.25);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
      padding: 0.5rem 0.8rem;
      border-radius: 30px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .nav-links a.active-link {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 12px rgba(30, 95, 255, 0.25);
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1.5rem 3rem;
      min-height: calc(100vh - var(--topbar-height));
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 580px;
      border: 1px solid var(--border);
    }

    .auth-card h2 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auth-card .subhead {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      color: var(--text-dark);
    }

    input, select {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-size: 0.95rem;
      background: #fafcff;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5b6e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2rem;
      padding-right: 2.8rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: white;
      box-shadow: 0 0 0 4px rgba(30, 95, 255, 0.1);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 3rem;
    }

    .password-field i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #8a99aa;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: default;
      margin-top: 1.2rem;
      box-shadow: 0 10px 20px rgba(30, 95, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .row-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .optional-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.8rem;
      text-align: center;
    }

    hr {
      margin: 1.5rem 0 1rem;
      border: none;
      border-top: 1px solid var(--border);
    }

    .footer-note {
      text-align: center;
      color: #7a8b9f;
      font-size: 0.8rem;
    }

    .msg-box {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .msg-box.success { background: #e6f7ee; color: #0e8a4d; }
    .msg-box.error { background: #fdeaea; color: #d32f2f; }

    /* Demo spacer to show scroll behavior */
    .demo-spacer {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      margin: 0 2rem;
    }

    @media (max-width: 550px) {
      .row-fields {
        grid-template-columns: 1fr;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        height: auto;
        min-height: var(--topbar-height);
      }
      .auth-wrapper {
        padding-top: 2.5rem;
      }
      .auth-card {
        padding: 2rem 1.5rem;
      }
      body {
        padding-top: 90px;
      }
      :root {
        --topbar-height: 90px;
      }
    }
  </style>
</head>
<body>
  <!-- Smart sticky header -->
  <header class="topbar" id="smartHeader">
    <div class="logo-area">
      <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
      <span>Campus<span style="color: var(--primary);">Help</span></span>
    </div>
    <nav class="nav-links">
      <a href="#"><i class="fas fa-home"></i> Home</a>
      <a href="#"><i class="fas fa-sign-in-alt"></i> Login</a>
      <a href="#" class="active-link"><i class="fas fa-user-plus"></i> Register</a>
    </nav>
  </header>

  <!-- Final Registration Form (editable email, full blood group dropdown, Department text) -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2><i class="fas fa-user-plus" style="color: var(--primary);"></i> Create an Account</h2>
      <div class="subhead">Join Campus Help — it takes less than a minute.</div>
      <div id="msgBox"></div>
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="regFullName"><i class="fas fa-user" style="margin-right: 6px;"></i>Full Name</label>
        <input type="text" id="regFullName" placeholder="" value="">
      </div>
      
      <!-- Email (editable, placeholder shows example) -->
      <div class="form-group">
        <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="regEmail" placeholder="yourname@hamdarduniversity.edu.bd" value="">
        <div style="font-size:0.75rem; color:#8a99aa; margin-top:0.4rem;"><i class="fas fa-circle-info"></i> Only @hamdarduniversity.edu.bd emails are accepted</div>
      </div>
      
      <!-- Password -->
      <div class="form-group">
        <label for="regPassword"><i class="fas fa-key"></i> Password</label>
        <div class="password-field">
          <input type="password" id="regPassword" placeholder="" value="">
          <i class="fas fa-eye"></i>
        </div>
      </div>
      
      <!-- Student/Staff ID & Phone -->
      <div class="row-fields">
        <div class="form-group">
          <label for="regId"><i class="fas fa-id-card"></i> Student/Staff ID</label>
          <input type="text" id="regId" placeholder="" value="">
        </div>
        <div class="form-group">
          <label for="regPhone"><i class="fas fa-phone-alt"></i> Phone</label>
          <input type="tel" id="regPhone" placeholder="" value="">
        </div>
      </div>
      
      <!-- Blood Group dropdown (full options) -->
      <div class="form-group">
        <label for="regBlood"><i class="fas fa-tint"></i> Blood Group</label>
        <select id="regBlood">
          <option value="" disabled selected>-- Select --</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
      
      <!-- Department (simple text field) -->
      <div class="form-group">
        <label for="regDept"><i class="fas fa-building"></i> Department</label>
        <input type="text" id="regDept" placeholder="Department" value="">
      </div>
      
      <button class="btn-submit" id="registerBtn" style="cursor:pointer;"><i class="fas fa-user-check"></i> Register</button>
      <div class="optional-note">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration:none;">Login</a></div>
      <hr />
      <div class="footer-note"><i class="fas fa-graduation-cap"></i> Campus Help Platform · community first</div>
    </div>
  </div>

  <!-- Demo spacer to show scroll behavior -->
  <div class="demo-spacer">
    <div>
      <i class="fas fa-arrow-down" style="display: block; font-size: 2rem; margin-bottom: 1rem; color: var(--primary);"></i>
      Scroll down to hide the topbar<br>
      <span style="font-size: 0.8rem; opacity: 0.7;">Scroll up to show it again</span>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Smart scroll header
    (function() {
      const header = document.getElementById('smartHeader');
      if (!header) return;
      let lastScrollY = window.scrollY;
      let ticking = false;
      function updateHeader() {
        const currentScrollY = window.scrollY;
        const headerHeight = header.offsetHeight;
        if (currentScrollY < lastScrollY || currentScrollY < 10) {
          header.classList.remove('header-hidden');
        } else if (currentScrollY > lastScrollY && currentScrollY > headerHeight) {
          header.classList.add('header-hidden');
        }
        lastScrollY = currentScrollY;
        ticking = false;
      }
      window.addEventListener('scroll', function() {
        if (!ticking) { window.requestAnimationFrame(updateHeader); ticking = true; }
      });
      window.addEventListener('load', updateHeader);
      updateHeader();
    })();

    // toggle password visibility
    document.querySelector('.password-field i').addEventListener('click', function() {
      const input = document.getElementById('regPassword');
      if (input.type === 'password') {
        input.type = 'text';
        this.classList.remove('fa-eye');
        this.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        this.classList.remove('fa-eye-slash');
        this.classList.add('fa-eye');
      }
    });

    // Handle registration
    document.getElementById('registerBtn').addEventListener('click', async function(e) {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      msgBox.innerHTML = '';

      const name = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const student_id = document.getElementById('regId').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const blood_group = document.getElementById('regBlood').value;
      const department = document.getElementById('regDept').value.trim();

      if (!name || !email || !password) {
        msgBox.innerHTML = '<div class="msg-box error">Please fill in your name, email, and password.</div>';
        return;
      }
      if (!email.toLowerCase().endsWith('@hamdarduniversity.edu.bd')) {
        msgBox.innerHTML = '<div class="msg-box error">Only @hamdarduniversity.edu.bd emails are allowed to register.</div>';
        return;
      }

      try {
        await apiCall('/auth/register', 'POST', { name, email, password, student_id, phone, blood_group, department }, false);
        msgBox.innerHTML = '<div class="msg-box success">Registration successful! Redirecting to login...</div>';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        msgBox.innerHTML = `<div class="msg-box error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
