<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Donation - Campus Help Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="topbar">
    <a href="home.html" class="logo-area">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span>Campus<span style="color: var(--primary);">Help</span></span>
    </a>
    <nav class="nav-links">
        <a href="home.html"><i class="fas fa-home"></i> Home</a>
        <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </nav>
</header>

<div class="container">

    <div class="tabs">
        <a href="#" class="active" onclick="showSection('requestsSection')">📋 View Requests</a>
        <a href="#" onclick="showSection('postSection')">➕ Post Request</a>
        <a href="#" onclick="showSection('searchSection')">🔍 Search Donors</a>
        <a href="#" onclick="showSection('donorSection')">🩸 Become a Donor</a>
    </div>

    <!-- View open blood requests -->
    <div class="card" id="requestsSection">
        <h2>Open Blood Requests</h2>
        <div id="requestsList">Loading...</div>
        <div id="requestsPagination"></div>
    </div>

    <!-- Post a new blood request -->
    <div class="card" id="postSection" style="display:none;">
        <h2 id="postSectionTitle">Post a Blood Request</h2>
        <div id="postMsg"></div>
        <form id="requestForm">
            <label>Blood Group Needed</label>
            <select id="blood_group_needed" required>
                <option value="">-- Select --</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>O+</option><option>O-</option>
                <option>AB+</option><option>AB-</option>
            </select>

            <label>Patient Name</label>
            <input type="text" id="patient_name">

            <label>Hospital / Location</label>
            <input type="text" id="hospital_location" required>

            <label>Units Needed</label>
            <input type="number" id="units_needed" value="1" min="1">

            <label>Urgency</label>
            <select id="urgency_level">
                <option value="normal">Normal</option>
                <option value="urgent">Urgent</option>
                <option value="critical">Critical</option>
            </select>

            <label>Photo (optional)</label>
            <input type="file" id="requestImage" accept="image/*">
            <img id="requestImagePreview" style="display:none; max-width:150px; margin-top:8px; border-radius:8px;">

            <button type="submit" id="requestSubmitBtn">Post Request</button>
        </form>
    </div>

    <!-- Search donors -->
    <div class="card" id="searchSection" style="display:none;">
        <h2>Search Donors</h2>
        <label>Blood Group</label>
        <select id="searchBloodGroup">
            <option value="">-- Any --</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option>
            <option>AB+</option><option>AB-</option>
        </select>
        <label>Location</label>
        <input type="text" id="searchLocation" placeholder="e.g. Hostel 3, Dhaka">
        <button onclick="searchDonors()">Search</button>
        <div id="donorResults" style="margin-top:20px;"></div>
    </div>

    <!-- Become a donor -->
    <div class="card" id="donorSection" style="display:none;">
        <h2>Become a Donor</h2>
        <div id="donorMsg"></div>
        <label>Your current location (for donor search)</label>
        <input type="text" id="donorLocation" placeholder="e.g. Hostel 3, Dhaka">
        <button onclick="becomeDonor()">Register as Donor</button>
    </div>

</div>

<!-- Post Detail Modal (view full details + comments) -->
<div id="postDetailModal" class="modal-overlay" onclick="closePostDetailModalOnOverlay(event)">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header">
      <h2 id="detailTitle">Blood Request</h2>
      <span class="modal-close" onclick="closePostDetailModal()">&times;</span>
    </div>
    <div id="detailContent"></div>

    <hr style="border:none; border-top:1px solid var(--border); margin:1.2rem 0;">

    <h3 style="font-size:1.05rem; margin-bottom:0.8rem;"><i class="fas fa-comments"></i> Comments</h3>
    <div id="detailComments" style="margin-bottom:1rem;"></div>

    <div id="replyingBanner" class="replying-banner">
      <span id="replyingBannerText"></span>
      <button onclick="cancelReply()" title="Cancel reply"><i class="fas fa-times"></i></button>
    </div>
    <div class="comment-input-box">
      <input type="text" id="newCommentText" placeholder="Write a comment..." onkeydown="if(event.key==='Enter'){event.preventDefault(); submitComment();}">
      <button onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Edit Blood Request Modal (opens in place, without leaving this page) -->
<div id="editRequestModal" class="modal-overlay" onclick="closeEditRequestModalOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2><i class="fas fa-pen"></i> Edit Blood Request</h2>
      <span class="modal-close" onclick="closeEditRequestModal()">&times;</span>
    </div>
    <div id="editRequestMsg"></div>
    <form id="editRequestForm">
      <input type="hidden" id="editReqId" value="">

      <label>Blood Group Needed</label>
      <select id="editReqBloodGroup" required>
        <option value="">-- Select --</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option>
        <option>AB+</option><option>AB-</option>
      </select>

      <label>Patient Name</label>
      <input type="text" id="editReqPatientName">

      <label>Hospital / Location</label>
      <input type="text" id="editReqLocation" required>

      <label>Units Needed</label>
      <input type="number" id="editReqUnits" value="1" min="1">

      <label>Urgency</label>
      <select id="editReqUrgency">
        <option value="normal">Normal</option>
        <option value="urgent">Urgent</option>
        <option value="critical">Critical</option>
      </select>

      <label>Photo (optional, leave blank to keep current)</label>
      <input type="file" id="editReqImage" accept="image/*">
      <img id="editReqImagePreview" style="display:none; max-width:150px; margin-top:8px; border-radius:8px;">

      <div style="display:flex; gap:0.6rem; margin-top:1.2rem; flex-wrap:wrap;">
        <button type="submit"><i class="fas fa-check"></i> Save Changes</button>
        <button type="button" class="secondary" onclick="closeEditRequestModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/blood.js"></script>
</body>
</html>
