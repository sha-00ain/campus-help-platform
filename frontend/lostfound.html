<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost & Found - Campus Help Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="topbar" id="smartHeader">
    <a href="home.html" class="logo-area">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span>Campus<span style="color: var(--primary);">Help</span></span>
    </a>
    <nav class="nav-links">
        <a href="home.html"><i class="fas fa-home"></i> <span class="nav-label">Home</span></a>
        <div class="notif-bell-wrap">
            <button class="notif-bell-btn" id="notifBell" onclick="toggleNotifDropdown()">
                <i class="fas fa-bell"></i>
                <span class="notif-badge" id="notifBadge">0</span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-dropdown-header">
                    <span>Notifications</span>
                    <button onclick="markAllNotifsRead()">Mark all read</button>
                </div>
                <div id="notifList"></div>
            </div>
        </div>
        <a href="profile.html"><i class="fas fa-user"></i> <span class="nav-label">Profile</span></a>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span class="nav-label">Logout</span></button>
    </nav>
</header>

<div class="container">

    <div class="tabs">
        <a href="#" class="active" onclick="showSection('browseSection')">🔍 Browse Items</a>
        <a href="#" onclick="showSection('postSection')">➕ Post Item</a>
        <a href="#" onclick="showSection('claimsSection')">📥 Claims on My Items</a>
    </div>

    <!-- Browse items -->
    <div class="card" id="browseSection">
        <h2>Browse Lost & Found Items</h2>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <select id="filterType" onchange="loadItems()">
                <option value="">All</option>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>
            <input type="text" id="filterKeyword" placeholder="Search keyword...">
            <button onclick="loadItems()">Search</button>
        </div>
        <div id="itemsList">Loading...</div>
        <div id="itemsPagination"></div>
    </div>

    <!-- Post item -->
    <div class="card" id="postSection" style="display:none;">
        <h2 id="postSectionTitle">Post a Lost or Found Item</h2>
        <div id="postMsg"></div>
        <form id="itemForm">
            <label>Type</label>
            <select id="item_type" required>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>

            <label>Category</label>
            <input type="text" id="category" placeholder="e.g. Electronics, Bag, Documents">

            <label>Title</label>
            <input type="text" id="title" required placeholder="e.g. Black backpack">

            <label>Description</label>
            <textarea id="description" placeholder="Describe the item in detail..."></textarea>

            <label>Location</label>
            <input type="text" id="location" placeholder="e.g. Library, 2nd floor">

            <label>Date</label>
            <input type="date" id="date_occurred">

            <label>Photo (optional)</label>
            <input type="file" id="itemImage" accept="image/*">
            <img id="itemImagePreview" style="display:none; max-width:150px; margin-top:8px; border-radius:8px;">

            <button type="submit" id="itemSubmitBtn">Post Item</button>
        </form>
    </div>

    <!-- Claims on my items -->
    <div class="card" id="claimsSection" style="display:none;">
        <h2>Claim Requests on My Items</h2>
        <div id="claimsList">Loading...</div>
    </div>

</div>

<!-- Post Detail Modal (view full details + comments) -->
<div id="postDetailModal" class="modal-overlay" onclick="closePostDetailModalOnOverlay(event)">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header">
      <h2 id="detailTitle">Item</h2>
      <span class="modal-close" onclick="closePostDetailModal()">&times;</span>
    </div>
    <div id="detailContent"></div>

    <hr style="border:none; border-top:1px solid var(--border); margin:1.2rem 0;">

    <h3 style="font-size:1.05rem; margin-bottom:0.8rem;"><i class="fas fa-comments"></i> Comments</h3>
    <div id="detailComments" style="margin-bottom:1rem;"></div>

    <div id="replyingBanner" class="replying-banner">
      <span id="replyingBannerText"></span>
      <button onclick="cancelReply()" title="Cancel reply"><i class="fas fa-times"></i></button>
    </div>
    <div class="comment-input-box">
      <input type="text" id="newCommentText" placeholder="Write a comment..." onkeydown="if(event.key==='Enter'){event.preventDefault(); submitComment();}">
      <button onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Edit Item Modal (opens in place, without leaving this page) -->
<div id="editItemModal" class="modal-overlay" onclick="closeEditItemModalOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2><i class="fas fa-pen"></i> Edit Item</h2>
      <span class="modal-close" onclick="closeEditItemModal()">&times;</span>
    </div>
    <div id="editItemMsg"></div>
    <form id="editItemForm">
      <input type="hidden" id="editItemId" value="">

      <label>Type</label>
      <select id="editItemType" required>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>

      <label>Category</label>
      <input type="text" id="editItemCategory" placeholder="e.g. Electronics, Bag, Documents">

      <label>Title</label>
      <input type="text" id="editItemTitle" required placeholder="e.g. Black backpack">

      <label>Description</label>
      <textarea id="editItemDescription" placeholder="Describe the item in detail..."></textarea>

      <label>Location</label>
      <input type="text" id="editItemLocation" placeholder="e.g. Library, 2nd floor">

      <label>Date</label>
      <input type="date" id="editItemDate">

      <label>Photo (optional, leave blank to keep current)</label>
      <input type="file" id="editItemImage" accept="image/*">
      <img id="editItemImagePreview" style="display:none; max-width:150px; margin-top:8px; border-radius:8px;">

      <div style="display:flex; gap:0.6rem; margin-top:1.2rem; flex-wrap:wrap;">
        <button type="submit"><i class="fas fa-check"></i> Save Changes</button>
        <button type="button" class="secondary" onclick="closeEditItemModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
<script src="js/lostfound.js"></script>
<script>
  // Smart scroll behavior for topbar (same as the home feed page)
  (function() {
    const header = document.getElementById('smartHeader');
    if (!header) return;

    let lastScrollY = window.scrollY;
    let ticking = false;

    function updateHeader() {
      const currentScrollY = window.scrollY;
      const headerHeight = header.offsetHeight;

      if (currentScrollY < lastScrollY || currentScrollY < 10) {
        header.classList.remove('header-hidden');
      } else if (currentScrollY > lastScrollY && currentScrollY > headerHeight) {
        header.classList.add('header-hidden');
      }

      lastScrollY = currentScrollY;
      ticking = false;
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeader);
        ticking = true;
      }
    });

    window.addEventListener('load', function() {
      updateHeader();
    });

    updateHeader();
  })();
</script>
</body>
</html>
